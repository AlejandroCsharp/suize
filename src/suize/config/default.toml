# Configuración por defecto de Suize.
#
# Para personalizarla, crea ~/.config/suize/config.toml (o apunta SUIZE_CONFIG
# a otra ruta) con SOLO las claves que quieras cambiar: se combinan por encima
# de estos valores. Las listas (como time_presets) se reemplazan completas.

[scan]
# Objetivo que se propone por defecto en el menú y en `suize scan` sin argumento.
default_target = "127.0.0.1"
# Tiempo máximo de un escaneo de Nmap, en segundos.
timeout = 600
# Perfil de escaneo: "fast" (-F, 100 puertos), "standard" (1000 puertos) o "full" (-p-).
profile = "standard"

[logs]
# Número máximo de entradas que se piden a journalctl (--lines).
lines = 200
# Tiempo máximo de una consulta a journalctl, en segundos.
timeout = 60
# Cuántas unidades mostrar en el "top" del resumen.
top_units = 5
# Preset preseleccionado en el menú y usado por `suize scan --correlate`.
default_time_preset = "1h"

# Presets temporales que ofrece el menú. `key` admite:
#   - duraciones relativas: "15m", "30min", "2h", "3d", "1w"...
#   - "today" / "yesterday"
#   - "custom": pide fechas exactas al usuario
[[logs.time_presets]]
key = "15m"
label = "Últimos 15 minutos"

[[logs.time_presets]]
key = "1h"
label = "Última hora"

[[logs.time_presets]]
key = "6h"
label = "Últimas 6 horas"

[[logs.time_presets]]
key = "24h"
label = "Últimas 24 horas"

[[logs.time_presets]]
key = "7d"
label = "Últimos 7 días"

[[logs.time_presets]]
key = "today"
label = "Hoy"

[[logs.time_presets]]
key = "yesterday"
label = "Ayer"

[[logs.time_presets]]
key = "custom"
label = "Personalizado (fecha exacta)"

# ---------------------------------------------------------------- correlación
#
# Qué unidades systemd puede atender cada puerto abierto. Suize propone estos
# nombres como candidatos y después descarta los que no existen en el sistema.
#
# Para añadir un servicio propio, o cambiar uno de estos, basta con repetir la
# clave en tu archivo de configuración: se combina entrada por entrada, así que
# no hace falta copiar toda la tabla.
#
#     [correlation.ports]
#     8006 = ["pveproxy"]          # añade un servicio nuevo
#     3306 = ["mariadb"]           # sustituye los candidatos de un puerto
#     27017 = []                   # desactiva un puerto de la tabla
#
# Los nombres van sin el sufijo .service, y una instancia de plantilla como
# postgresql@16-main la encuentra igualmente el nombre base "postgresql".

[correlation.ports]
22 = ["ssh", "sshd"]
80 = ["nginx", "apache2", "httpd"]
443 = ["nginx", "apache2", "httpd"]
3306 = ["mysql", "mariadb"]
5432 = ["postgresql"]
6379 = ["redis", "redis-server"]
27017 = ["mongod", "mongodb"]
21 = ["vsftpd", "proftpd", "pure-ftpd"]
25 = ["postfix", "exim4"]
111 = ["rpcbind"]
139 = ["smbd"]
445 = ["smbd"]
587 = ["postfix", "exim4"]
631 = ["cups"]
1883 = ["mosquitto"]
2049 = ["nfs-server"]
3389 = ["xrdp"]
9090 = ["cockpit"]
11211 = ["memcached"]

# Nombre del servicio que detecta Nmap → unidades candidatas. Cubre los
# servicios que escuchan en un puerto no estándar (SSH en el 2222, por
# ejemplo), donde la tabla anterior no sirve.

[correlation.services]
ssh = ["ssh", "sshd"]
http = ["nginx", "apache2", "httpd"]
https = ["nginx", "apache2", "httpd"]
mysql = ["mysql", "mariadb"]
postgresql = ["postgresql"]
redis = ["redis", "redis-server"]
mongodb = ["mongod", "mongodb"]
ipp = ["cups"]
ftp = ["vsftpd", "proftpd", "pure-ftpd"]
smtp = ["postfix", "exim4"]
submission = ["postfix", "exim4"]
rpcbind = ["rpcbind"]
netbios-ssn = ["smbd"]
microsoft-ds = ["smbd"]
nfs = ["nfs-server"]
mqtt = ["mosquitto"]
memcache = ["memcached"]
ms-wbt-server = ["xrdp"]
