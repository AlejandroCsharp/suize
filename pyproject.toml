[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suize"
dynamic = ["version"]
description = "CLI para Linux que combina escaneos de Nmap con logs de journalctl y los correlaciona por servicio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["nmap", "journalctl", "systemd", "cli", "logs", "network"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Fijado a la versión menor: cada release de ruff puede añadir reglas o cambiar
    # el formato y romper la CI sin cambios en el código.
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/TU-USUARIO/suize"
Issues = "https://github.com/TU-USUARIO/suize/issues"
Documentation = "https://github.com/TU-USUARIO/suize/tree/main/docs"

[project.scripts]
suize = "suize.cli:main"

[tool.setuptools.dynamic]
version = { attr = "suize.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"suize.config" = ["default.toml"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
# La UI y la documentación están en español y usan a propósito caracteres
# como «…», «·», «→» o «—», que RUF001-003 marcarían como ambiguos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["suize"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src"]
